services:
  - type: web
    name: gridmind-ai-api
    runtime: python
    rootDir: GRIDMIND-AI/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: FRONTEND_ORIGIN
        sync: false
